version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: forgetrack-postgres
    environment:
      POSTGRES_DB: forgetrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: forgetrack-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    restart: always

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
