version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: forgetrack-postgres-prod
    environment:
      POSTGRES_DB: ${DB_DATABASE:-forgetrack}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_password}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forgetrack-redis-prod
    ports:
      - '6379:6379'
    volumes:
      - redisdata_prod:/data
    restart: always

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: forgetrack-api-prod
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secure_password}
      DB_DATABASE: ${DB_DATABASE:-forgetrack}
      DB_MIGRATIONS_RUN: "true"
      DB_LOGGING: "false"
      SESSION_SECRET: ${SESSION_SECRET:-change-to-a-secure-secret-key-in-prod}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: forgetrack-web-prod
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    ports:
      - '3000:3000'
    depends_on:
      - api
    restart: always

volumes:
  pgdata_prod:
    driver: local
  redisdata_prod:
    driver: local
